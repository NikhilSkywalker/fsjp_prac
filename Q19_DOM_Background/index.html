<!-- Q19: DOM Background Color Change -->
<!DOCTYPE html>
<html>
<body>
    <h1>Background changes every 5 seconds</h1>
    <script>
        const colors = ["red", "blue", "green", "yellow", "purple"];
        let idx = 0;
        // Logic: setInterval cycles the index and updates DOM body style
        setInterval(() => {
            document.body.style.backgroundColor = colors[idx];
            idx = (idx + 1) % colors.length; // Cycle logic
        }, 5000);
    </script>
</body>
</html>
